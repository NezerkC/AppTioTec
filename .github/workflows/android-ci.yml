name: "🤖 Android CI · Build & Test (AppTioTec)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar Kotlin, Ejecutar Tests y Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configurar Gradle con Caché
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: ✅ Compilar Código Kotlin y Jetpack Compose
        run: ./gradlew compileDebugKotlin

      - name: 🧪 Ejecutar Pruebas Unitarias (JUnit)
        run: ./gradlew testDebugUnitTest

      - name: 📦 Ensamblar APK Debug (AppTioTec)
        run: ./gradlew assembleDebug

      - name: 📤 Subir APK como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: AppTioTec-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
